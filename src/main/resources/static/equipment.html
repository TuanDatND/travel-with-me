<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh sách thiết bị · TreekTour</title><link rel="stylesheet" href="/assets/catalog/catalog.css"><script type="module" src="/assets/catalog/products.js"></script></head>
<body data-page="products"><div id="shell"></div><main>
  <div class="breadcrumb">TreekTour / Thiết bị</div>
  <header class="page-heading"><div><p class="eyebrow">KHÁM PHÁ & CHUẨN BỊ</p><h1>Thiết bị cho chuyến đi</h1><p class="muted">Chọn đồ phù hợp, xem giá và kiểm tra lượng có thể thuê tại chi nhánh.</p></div></header>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <section class="panel"><form id="filters" class="filters">
    <label>Tìm thiết bị<input name="keyword" type="search" placeholder="Tên thiết bị…"></label>
    <label>Danh mục<input name="category" placeholder="Camping, Hiking…"></label>
    <label>Nhu cầu<select name="mode"><option value="">Mua & thuê</option><option value="SALE">Mua thiết bị</option><option value="RENTAL">Thuê thiết bị</option></select></label>
    <label>Giá từ<input name="minPrice" type="number" min="0" step="0.01" placeholder="VNĐ"></label>
    <label>Giá đến<input name="maxPrice" type="number" min="0" step="0.01" placeholder="VNĐ"></label><button>Tìm kiếm</button>
  </form></section>
  <div class="section-heading"><h2>Danh sách thiết bị</h2><span id="count" class="muted"></span></div>
  <div id="products" class="product-grid" aria-live="polite"></div>
  <div class="pagination"><button id="prev" class="secondary" disabled>← Trang trước</button><span id="paging"></span><button id="next" class="secondary" disabled>Trang sau →</button></div>
</main></body></html>
