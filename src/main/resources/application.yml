spring:
  config:
    import: optional:file:.env[.properties]

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:thay_bang_client_id_cua_ban}
            client-secret: ${GOOGLE_CLIENT_SECRET:thay_bang_client_secret_cua_ban}
            scope:
              - email
              - profile

  application:
    name: ${APP_NAME:treektour}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/treektour}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          time_zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    ignore-missing-migrations: true
    validate-on-migrate: false
    out-of-order: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.coc.sba_treektour: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}

tour:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

zalopay:
  app-id: ${ZALOPAY_APP_ID:2553}
  key1: ${ZALOPAY_KEY1:PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
  key2: ${ZALOPAY_KEY2:kLtgPl8YEStV6wsP}
  create-url: ${ZALOPAY_CREATE_URL:https://sb-openapi.zalopay.vn/v2/create}
  query-url: ${ZALOPAY_QUERY_URL:https://sb-openapi.zalopay.vn/v2/query}
  callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/payment/zalopay/callback}
