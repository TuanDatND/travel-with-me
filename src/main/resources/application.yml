spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ${APP_NAME:treektour}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/treektour}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          time_zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.coc.sba_treektour: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}

tour:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

zalopay:
  app-id: ${ZALOPAY_APP_ID}
  key1: ${ZALOPAY_KEY1}
  key2: ${ZALOPAY_KEY2}
  create-url: ${ZALOPAY_CREATE_URL}
  query-url: ${ZALOPAY_QUERY_URL}
  callback-url: ${ZALOPAY_CALLBACK_URL}
